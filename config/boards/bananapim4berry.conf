# Allwinner H618 quad core 2/4GB RAM 8GB eMMC SoC WiFi\Bt HDMI SPI USB-C
BOARD_NAME="BananaPi M4 Berry"
BOARD_VENDOR="sinovoip"
BOARDFAMILY="sun50iw9-bpi"
BOARD_MAINTAINER="The-going"
INTRODUCED="2023"
BOOTCONFIG="bananapi_m4_berry_defconfig"

BOOTPATCHDIR="v2025-sunxi"
BOOTBRANCH_BOARD="tag:v2025.04"

OVERLAY_PREFIX="sun50i-h616"
BOOT_FDT_FILE="sun50i-h618-bananapi-m4-berry.dtb"
BOOT_LOGO="desktop"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"

PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools hostapd gpiod i2c-tools python3-libgpiod python3-spidev v4l-utils"

if [[ "${BUILD_DESKTOP:-no}" == "yes" ]]; then
	PACKAGE_LIST_BOARD+=" gstreamer1.0-tools gstreamer1.0-plugins-bad libdrm-tests"
fi

function image_specific_armbian_env_ready__bananapi_m4berry_cma() {

	# H.265 1080p 解碼的連續緩衝區需求會超過核心預設的 64 MiB。
	local env_file="${SDCARD}/boot/armbianEnv.txt"
	if grep -Eq '^extraargs=.*cma=' "${env_file}"; then
		sed -E -i '/^extraargs=/ s/cma=[^[:space:]]+/cma=256M/' "${env_file}"
	elif grep -q '^extraargs=' "${env_file}"; then
		sed -i '/^extraargs=/ s/$/ cma=256M/' "${env_file}"
	else
		echo "extraargs=cma=256M" >> "${env_file}"
	fi

}

function post_family_tweaks_bsp__bananapi_module_conf() {

	mkdir -p "${destination}"/etc/udev/rules.d/
	mkdir -p "${destination}"/usr/local/bin/
	mkdir -p "${destination}"/usr/local/sbin/

	install -m 0644 "${SRC}"/packages/bsp/bananapi-m4berry/99-bananapi-m4berry-io.rules \
			"${destination}"/etc/udev/rules.d/99-bananapi-m4berry-io.rules
	install -m 0755 "${SRC}"/packages/bsp/bananapi-m4berry/bpi-m4berry-hw-info \
			"${destination}"/usr/local/bin/bpi-m4berry-hw-info
	install -m 0755 "${SRC}"/packages/bsp/bananapi-m4berry/bpi-m4berry-io-compat-install \
			"${destination}"/usr/local/sbin/bpi-m4berry-io-compat-install

}
