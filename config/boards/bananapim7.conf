# Rockchip RK3588 octa core 8-32GB RAM SoC 2*2.5GBe eMMC USB3 NvME WIFI
source "${SRC}/config/boards/armsom-sige7.csc"
BOARD_NAME="Banana Pi M7"
BOARD_VENDOR="sinovoip"
BOARD_MAINTAINER="amazingfate"
INTRODUCED="2023"
BOOT_FDT_FILE="rockchip/rk3588-bananapi-m7.dtb"
# Those are included in armsom-sige7.csc, but this file is parsed directly
# by the JSON matrix generator and thus those need to be in here
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="vendor,current"
BOARDFAMILY="rockchip-rk3588"

# Current 候選固定可移動的 Radxa U-Boot 與 RKBin 來源。
BOOTBRANCH_BOARD="commit:39cd993e5d6296635438e84f4576b3a9bf76f86e"
RKBIN_GIT_REF="commit:1d3c61008fa823936ae7a59615393f8294b64456"
DDR_BLOB="rk35/rk3588_ddr_lp4_2112MHz_lp5_2736MHz_v1.11.bin"
BL31_BLOB="rk35/rk3588_bl31_v1.38.elf"
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools gpiod i2c-tools python3-libgpiod python3-spidev v4l-utils pciutils nvme-cli usbutils alsa-utils iw ethtool"

function post_family_config_branch_current__bananapim7_pin_uboot() {
	declare -g BOOTBRANCH="${BOOTBRANCH_BOARD}"
}
