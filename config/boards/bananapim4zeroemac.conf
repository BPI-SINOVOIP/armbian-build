# Allwinner H618 四核心、1/2/4GB RAM、Wi-Fi、SPI、USB-C 與預設 FPC24 乙太網路
BOARD_NAME="BananaPi BPI-M4-Zero EMAC"
BOARD_VENDOR="sinovoip"
BOARDFAMILY="sun50iw9-bpi"
BOARD_MAINTAINER="juliovendramini pyavitz"
INTRODUCED="2026"
BOOTCONFIG="bananapi_m4zero_defconfig"
OVERLAY_PREFIX="sun50i-h616"
BOOT_FDT_FILE="sun50i-h618-bananapi-m4-zero-emac.dtb"
DEFAULT_OVERLAYS="bananapi-m4-zero-emac-sdio-wifi-bt"
BOOT_LOGO="desktop"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"
FORCE_BOOTSCRIPT_UPDATE="yes"
BOOTBRANCH_BOARD="tag:v2026.01"
# 重用 M4 Zero 的 defconfig、H618 修正與 A1 DDR 參數，避免維護兩份 patch。
BOOTPATCHDIR="v2026.01 v2026.01/board_bananapim4zero"
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools"

# shellcheck source=config/boards/include/bananapi-h618-common.inc
source "${SRC}/config/boards/include/bananapi-h618-common.inc"

function post_family_tweaks_bsp__bananapi_m4zero_emac_firmware() {
	if [[ -d "${SRC}/packages/bsp/bananapi/brcm" ]] && [[ -d "${SRC}/packages/bsp/bananapi/rtl_bt" ]]; then
		mkdir -p "${destination}/lib/firmware/updates/brcm"
		mkdir -p "${destination}/lib/firmware/updates/rtl_bt"
		display_alert "${BOARD}" "安裝上游韌體" "info"
		cp -fr "${SRC}"/packages/bsp/bananapi/brcm/* "${destination}/lib/firmware/updates/brcm/"
		cp -fr "${SRC}"/packages/bsp/bananapi/rtl_bt/* "${destination}/lib/firmware/updates/rtl_bt/"
		ln -sfn cyfmac43455-sdio.bin \
			"${destination}/lib/firmware/updates/brcm/brcmfmac43455-sdio.sinovoip,bpi-m4-zero-emac.bin"
		ln -sfn cyfmac43455-sdio.1LC.txt \
			"${destination}/lib/firmware/updates/brcm/brcmfmac43455-sdio.sinovoip,bpi-m4-zero-emac.txt"
		ln -sfn cyfmac43455-sdio.1LC.clm_blob \
			"${destination}/lib/firmware/updates/brcm/brcmfmac43455-sdio.sinovoip,bpi-m4-zero-emac.clm_blob"
		ln -sfn BCM4345C0_003.001.025.0187.0366.1MW.hcd \
			"${destination}/lib/firmware/updates/brcm/BCM4345C0.sinovoip,bpi-m4-zero-emac.hcd"
	fi
}
