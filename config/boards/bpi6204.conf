# BPI-6204 (Based on Allwinner R40)
#
# Board support for BPI-6204, a variant of BananaPi M2 Ultra with
# custom hardware configuration (CS6202/CS6204)
#

BOARD_NAME="BPI-6204"
BOARDFAMILY="sun8i"
BOARD_MAINTAINER=""
BOOTCONFIG="Bananapi_M2_Ultra_defconfig"
KERNEL_TARGET="current,edge"
MODULES_BLACKLIST="lima"
OVERLAY_PREFIX="sun8i-r40"

# Use custom device tree
BOOT_FDT_FILE="allwinner/sun8i-r40-bpi-6204.dtb"
