# Rockchip RK3576 SoC octa core 8-64GB SoC 2*GBe eMMC USB3 NvME WIFI
source "${SRC}/config/boards/armsom-sige5.csc"
BOARD_NAME="Banana Pi M5 Pro"
BOARD_VENDOR="sinovoip"
BOARD_MAINTAINER="efectn"
INTRODUCED="2023"
BOOTCONFIG="bananapi-m5-pro-rk3576_defconfig"
BOOT_FDT_FILE="rockchip/rk3576-bananapi-m5-pro.dtb"
# Those are included in armsom-sige5.csc, but this file is parsed directly
# by the JSON matrix generator and thus those need to be in here
KERNEL_TARGET="edge,vendor"
BOARDFAMILY="rk35xx"

# Edge 候選固定 Linux、Radxa U-Boot 與 RKBin，避免可移動分支改變啟動鏈。
KERNELSOURCE_BOARD="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNELBRANCH_BOARD="commit:458c6079fc1d41d564c37679c8ace02cd83ee817"
BOOTBRANCH_BOARD="commit:39cd993e5d6296635438e84f4576b3a9bf76f86e"
RKBIN_GIT_REF="commit:1d3c61008fa823936ae7a59615393f8294b64456"
DDR_BLOB="rk35/rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.08.bin"
BL31_BLOB="rk35/rk3576_bl31_v1.20.elf"
BOOST_BLOB="rk35/rk3576_boost_v1.02.bin"
USBPLUG_BLOB="rk35/rk3576_usbplug_v1.03.bin"
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools gpiod i2c-tools python3-libgpiod python3-spidev v4l-utils pciutils nvme-cli usbutils alsa-utils iw ethtool"

function post_family_config_branch_edge__bananapim5pro_pin_sources() {
	declare -g KERNELSOURCE="${KERNELSOURCE_BOARD}"
	declare -g KERNELBRANCH="${KERNELBRANCH_BOARD}"
	declare -g BOOTBRANCH="${BOOTBRANCH_BOARD}"
}
