# Allwinner A733 quad core 4GB/8GB/16GB RAM SoC
BOARD_NAME="Banana Pi M8"
BOARD_VENDOR="sinovoip"
BOARDFAMILY="sun60iw2"
BOARD_MAINTAINER="Qubot"
INTRODUCED="2026"
BOOTCONFIG="bananapi_m8_defconfig"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="sunxi/sun60i-a733-bananapi-m8.dtb"
SERIALCON="ttyS0"
# Wireless modules are selected at runtime from their SDIO ID. Do not list a
# vendor Wi-Fi module here: both vendor drivers power-cycle the same SDIO host
# from module_init(), so forcing more than one of them can hard-lock the SoC.
BPI_M8_WIFI_MODULE="auto"
MODULES="pvrsrvkm vin_io imx415_mipi vin_v4l2"
PACKAGE_LIST_BOARD="wireless-regdb ethtool memtester libdrm-tests spi-tools v4l-utils"
# Bullseye and Jammy include hwclock in util-linux, before the package split.
case "${RELEASE:-}" in
	bullseye | jammy) ;;
	*) PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} util-linux-extra" ;;
esac
KERNEL_TARGET="legacy"
KERNEL_TEST_TARGET="legacy"
DISTRIB_TYPE_LEGACY="bullseye bookworm trixie jammy noble resolute"
SKIP_BOOTSPLASH="yes"
IMAGE_PARTITION_TABLE="msdos"
BOOTFS_TYPE="fat"
BOOTSIZE=256
BOOT_FS_LABEL="boot"
ROOT_FS_LABEL="rootfs"
BOOT_PARTITION_NAME="boot"
ROOT_PARTITION_NAME="rootfs"
FORCE_BOOTSCRIPT_UPDATE="yes"

# Vendor signature and defaults requested by board maintainer
VENDOR="Bananapi-Armbian"
VENDORURL="https://www.banana-pi.org/"
VENDORSUPPORT="https://forum.banana-pi.org/"
VENDORPRIVACY="https://www.banana-pi.org/"
VENDORBUGS="https://forum.banana-pi.org/"
VENDORDOCS="https://wiki.banana-pi.org/"
VENDORLOGO="bpi-logo"
ROOTPWD="1234"
MAINTAINER="Qubot"
MAINTAINERMAIL="qubot@banana-pi.com"

enable_extension "bpi-sun60iw2-bsp"
enable_extension "bpi-m8-wireless"
