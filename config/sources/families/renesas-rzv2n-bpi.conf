function post_family_tweaks__renesas_rzv2n_bpi_boot_files()
{
	display_alert "$BOARD" "Installing boot files" "info"

	local uboot_package_dir="${SDCARD}/usr/lib/linux-u-boot-${BRANCH}-${BOARD}"
	local boot_file

	# replace bpi bootlogo
	[[ -f "${SDCARD}"/boot/boot.bmp ]] && rm "${SDCARD}"/boot/boot.bmp

	# 從已安裝的 U-Boot 套件取檔，避免依賴可能被清除的建置工作樹。
	for boot_file in bl2_bp_sd.bin fip.bin; do
		[[ -f "${uboot_package_dir}/${boot_file}" ]] ||
			exit_with_error "AI2N U-Boot 套件缺少必要檔案：${boot_file}"
	done
	run_host_command_logged cp -pv \
		"${uboot_package_dir}/bl2_bp_sd.bin" \
		"${uboot_package_dir}/fip.bin" \
		"${SDCARD}/boot/"

	cp "${SRC}"/packages/blobs/bpi-renesas/bsp/rzv2n/OpenCV_Bin.bin "${SDCARD}"/boot/OpenCV_Bin.bin
	cp "${SRC}"/packages/blobs/bpi-renesas/bsp/rzv2n/Codec_Bin.bin "${SDCARD}"/boot/Codec_Bin.bin
	cp "${SRC}"/packages/blobs/bpi-renesas/bsp/rzv2n/Flash_Writer_SCIF_RZV2N_DEV_LPDDR4X.mot "${SDCARD}"/boot/Flash_Writer_SCIF_RZV2N_DEV_LPDDR4X.mot
}

function post_family_tweaks__renesas_rzv2n_bpi_rootfs_files()
{
	display_alert "$BOARD" "Installing rootfs files" "info"

	# copy common board files
	run_host_command_logged rsync -a "${SRC}"/packages/bsp/bpi-renesas/* "${SDCARD}"
}

function post_family_tweaks__renesas_rzv2n_bpi_systemd()
{
	display_alert "${BOARD}" "Installing systemd service" "info"

	# CLI 映像不一定安裝 brltty；只有單元存在時才停用。
	if [[ -e "${SDCARD}/usr/lib/systemd/system/brltty.service" ||
		-e "${SDCARD}/lib/systemd/system/brltty.service" ]]; then
		chroot_sdcard systemctl disable brltty.service
	fi
}

function post_family_config__renesas_rzv2n_bpi_imagedebs()
{
	display_alert "${BOARD}" "Adding packages to image" "info"

	# install packages to image
        add_packages_to_image v4l-utils
        #remove_packages xxx
}

function pre_customize_image__renesas_rzv2n_bpi_docker()
{
	display_alert "${BOARD}" "Installing docker service" "info"

	if [[ "${DOCKER_INSTALL}" = "yes" ]]; then
		run_host_command_logged curl -fsSL get.docker.com -o "${SDCARD}"/usr/local/bin/get-docker.sh
		chroot_sdcard chmod 755 "/usr/local/bin/get-docker.sh"
		chroot_sdcard "/usr/local/bin/get-docker.sh"
	fi
}

function pre_customize_image__renesas_rzv2n_bpi_image()
{
	display_alert "${BOARD}" "Customizing board image" "info"
}
