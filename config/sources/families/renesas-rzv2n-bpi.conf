	legacy)
		declare -g KERNEL_MAJOR_MINOR="6.1"
		declare -g KERNELSOURCE="https://github.com/BPI-SINOVOIP/pi-linux.git"
		declare -g KERNELBRANCH="commit:48c742429129c095045823c204209bb2a92fb5b4"
		declare -g KERNEL_BTF="no"
		declare -g KERNELPATCHDIR="archive/rzv2n-6.1"
		declare -g KERNELDIR="${KERNEL_MAJOR_MINOR}__bpi-rzv2n__${ARCH}"
		declare -g KERNEL_IMAGE_TYPE="Image"
		declare -g KERNEL_INSTALL_TYPE="install" # install uncompressed kernel Image
		declare -g KERNEL_COMPILER="aarch64-linux-gnu-"
		declare -g KERNEL_USE_GCC="> 11.0"
		declare -g EXTRAWIFI=no
		;;
esac

