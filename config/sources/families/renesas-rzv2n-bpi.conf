function uboot_custom_postprocess()
{
	display_alert "$BOARD" "執行 U-Boot 後處理 ${PWD}" "info"

	local atfdir="$SRC/cache/sources/$ATFDIR/${ATFBRANCH##*:}"
	local bptool="${atfdir}/tools/renesas/bptool"
	local fiptool="${atfdir}/tools/fiptool/fiptool"
	local BL2="${atfdir}/build/v2n/release/bl2.bin"
	local BL31="${atfdir}/build/v2n/release/bl31.bin"
	local pack_out=rz_pack
	local bp_file
	run_host_command_logged mkdir -p "${pack_out}"
	bp_file="$(mktemp "${PWD}/${pack_out}/.bp.XXXXXX.bin")"
	run_host_command_logged make -C "${atfdir}/tools/renesas/rz_boot_param" PLAT=v2n
	run_host_command_logged make -C "${atfdir}/tools/fiptool" PLAT=v2n
	[[ -x "${bptool}" && -x "${fiptool}" ]] || exit_with_error "RZ/V2N 封裝工具建置失敗"

	# 分別建立 SPI、eMMC 與 SD 使用的 BL2 參數區塊。
	"${bptool}" "${BL2}" "${bp_file}" 0x08103000 spi
	cat "${bp_file}" "${BL2}" >"${pack_out}/bl2_bp_spi.bin"
	"${bptool}" "${BL2}" "${bp_file}" 0x08103000 mmc
	cat "${bp_file}" "${BL2}" >"${pack_out}/bl2_bp_emmc.bin"
	"${bptool}" "${BL2}" "${bp_file}" 0x08103000 esd
	cat "${bp_file}" "${BL2}" >"${pack_out}/bl2_bp_sd.bin"
	unlink "${bp_file}"

	# 將 BL31 與 U-Boot 封裝為 FIP，再產生原廠燒錄器使用的 S-record。
	"${fiptool}" create --align 16 --soc-fw "${BL31}" --nt-fw u-boot.bin "${pack_out}/fip.bin"
	objcopy -I binary -O srec --adjust-vma=0x08101E00 --srec-forceS3 "${pack_out}/bl2_bp_spi.bin" "${pack_out}/bl2_bp_spi.srec"
	objcopy -I binary -O srec --adjust-vma=0x08101E00 --srec-forceS3 "${pack_out}/bl2_bp_emmc.bin" "${pack_out}/bl2_bp_emmc.srec"
	objcopy -I binary -O srec --adjust-vma=0x08101E00 --srec-forceS3 "${pack_out}/bl2_bp_sd.bin" "${pack_out}/bl2_bp_sd.srec"
	objcopy -I binary -O srec --adjust-vma=0x0000 --srec-forceS3 "${pack_out}/fip.bin" "${pack_out}/fip.srec"
}

