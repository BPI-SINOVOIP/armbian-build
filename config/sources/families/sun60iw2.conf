# shellcheck source=config/sources/families/include/sunxi64_common.inc
source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"

declare -g LINUXFAMILY="sun60iw2"

[[ -z $CPUMIN ]] && CPUMIN=416000
[[ -z $CPUMAX ]] && CPUMAX=2002000
GOVERNOR=ondemand
OVERLAY_PREFIX="sun60i-a733"
OVERLAY_DIR="/boot/dtb/sunxi/overlay"

# Vendor BSP stack for A733
declare -g KERNEL_MAJOR_MINOR="5.15"
declare -g KERNELSOURCE="https://github.com/BPI-SINOVOIP/pi-linux.git"
declare -g KERNELBRANCH="branch:sun60iw2p1-5.15"
declare -g LINUXCONFIG="linux-sun60iw2-legacy"
declare -g KERNELPATCHDIR="sun60iw2-legacy"

declare -g BOOTSOURCE="https://github.com/BPI-SINOVOIP/pi-u-boot.git"
declare -g BOOTBRANCH="branch:sun60iw2p1-2018.07"
declare -g BOOTPATCHDIR="u-boot-sun60iw2"
declare -g BOOTDIR="u-boot-sun60iw2"
declare -g BOOTENV_FILE="sun60iw2.txt"
declare -g BOOTSCRIPT="boot-sun60iw2.cmd:boot.cmd"
declare -g UBOOT_COMPILER="${SRC}/cache/toolchain/gcc-linaro-7.2.1-2017.11-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-"
declare -g UBOOT_TARGET_MAP=";;dts/${BOARD}-u-boot.dts boot0_sdcard.fex boot0_emmc.fex boot0_nand.fex boot0_spinor.fex boot0_ufs.fex boot_package.fex"

# This BSP packs the matching prebuilt monitor, not another SoC's TF-A.
declare -g ATF_COMPILE="no"
declare -g ATF_TARGET_MAP=""
declare -g KERNEL_USE_MAINLINE_BARE_REPO="no"
declare -g UBOOT_USE_MAINLINE_BARE_REPO="no"
declare -g KERNEL_COMPILER="aarch64-linux-gnu-"
declare -g NAME_KERNEL="Image"
declare -g OFFSET=32

# This packaging flow needs busybox and dos2unix helpers.
function add_host_dependencies__sun60iw2_add_busybox_hostdep() {
	display_alert "Adding busybox dep" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} busybox dos2unix mtd-utils xxd u-boot-tools"
}

# shellcheck source=config/sources/families/include/sun60iw2-kernel.inc
source "${BASH_SOURCE%/*}/include/sun60iw2-kernel.inc"
# shellcheck source=config/sources/families/include/sun60iw2-uboot.inc
source "${BASH_SOURCE%/*}/include/sun60iw2-uboot.inc"
