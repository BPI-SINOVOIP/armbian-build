write_uboot_platform() {
	local tzk_payload="$1/bpi-m6-tzk-4MB.bin"
	local expected_sha256="${VS680_TZK_SHA256:-175e9b9313dffb70a97852ae21d855d3472916cc2af28f678ebcddc44828e411}"
	local actual_sha256

	if [[ ! -f "${tzk_payload}" ]]; then
		exit_with_error "缺少已封裝的 VS680 TZK 啟動載荷" "${tzk_payload}"
	fi
	actual_sha256="$(sha256sum "${tzk_payload}" | cut -d' ' -f1)"
	[[ "${actual_sha256}" == "${expected_sha256}" ]] ||
		exit_with_error "VS680 TZK 啟動載荷雜湊不符" "${actual_sha256}"
	dd if="${tzk_payload}" of="$2" bs=512 seek=1 conv=notrunc status=none
	dd if="$1/u-boot.bin" of="$2" bs=1k seek=2048 conv=notrunc status=none
}

family_tweaks_bsp() {
	echo "BPI: family_tweaks_bsp --- START ---"
	local bsp_archives=("$SRC"/packages/bsp/vs680/*.tgz)

	if [[ ! -e "${bsp_archives[0]}" ]]; then
		display_alert "$BOARD" "No optional VS680 AMP BSP archives found" "info"
		return 0
	fi

	for IN in "${bsp_archives[@]}"; do
		echo "tar xf $IN --keep-directory-symlink -C $destination"
		tar xf "$IN" --keep-directory-symlink -C "$destination"
	done
	ldconfig
	echo "BPI: family_tweaks_bsp ---  END  ---"
}
