#
# Banana Pi BPI-SM10／SpacemiT K3-CoM260 支援。
# Linux 與 U-Boot 來源固定至原廠 k3-br-v1.0.y manifest；啟動載荷則先採用
# 同一份 SDK 產生且逐檔核對雜湊的候選檔案。授權尚未閉合前不得公開發布。
#

declare -g ARCH="riscv64"
declare -g LINUXFAMILY="spacemit-k3-bpi"
declare -g GOVERNOR="performance"
declare -g EXTRAWIFI="no"

# 提交與 2026-05-26 同步的原廠 SDK 一致。使用 HTTPS 來源是為了讓 Armbian
# 產物中繼資料解析器可驗證，不依賴本機絕對路徑。
declare -g BOOTSOURCE="https://github.com/spacemit-com/uboot-2022.10.git"
declare -g BOOTBRANCH="commit:1b10c8119e1a9b5451a4236f6b384f7c91eed1e2"
declare -g BOOTDIR="u-boot-spacemit-k3"
declare -g BOOTCONFIG="k3_defconfig"
declare -g UBOOT_TARGET_MAP=";;env.bin bootinfo_block.bin FSBL.bin esos.itb fw_dynamic.itb u-boot.itb u-boot-env-default.bin README.txt"

case "${BRANCH}" in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELSOURCE="https://github.com/spacemit-com/linux-6.18.git"
		declare -g KERNELBRANCH="commit:27275ec8240cc49af3a525b8bc325d9b5029fb81"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-current"
		declare -g KERNELPATCHDIR="archive/spacemit-k3-bpi-6.18"
		;;
esac

function pre_prepare_partitions__spacemit_k3_vendor_layout() {
	declare -g OFFSET="12"
	declare -g BOOTSIZE="256"
	declare -g BOOTFS_TYPE="fat"
	declare -g IMAGE_PARTITION_TABLE="gpt"
	declare -g BOOT_FS_LABEL="BPI-BOOT"
	declare -g ROOT_FS_LABEL="BPI-ROOT"
}

function build_custom_uboot__spacemit_k3_bpi_package_vendor_blobs() {
	local blob_dir="${SRC}/packages/blobs/riscv64/spacemit-k3/bpi-sm10"
	local file expected actual
	local -A expected_sha256=(
		[env.bin]="e73d2c0c44c6b00019a4c6190e8e7d03a37be710a20fa76b887bdd098fa1ff51"
		[bootinfo_block.bin]="8cde21b4e18f0b72f2c98b5ae686dfe8ef75d8dc641393e97b52cf318b294e4b"
		[FSBL.bin]="d18ceb20ae2433e441e9a5d935b1db34a7d35b5cf074979d8104ffc35c4971f2"
		[esos.itb]="11099edb92c9721ebb207de3a200905618dcfded32c19f5ef0525275c253bf28"
		[fw_dynamic.itb]="6ba858dcbf79371cdf3cc4770e036ea448e7d81547bf880af5b2903e7296a044"
		[u-boot.itb]="1f7752ad032e3b04e30ffce5e9e3a79b427c05efc7fc7ef4130fde23a7990982"
		[u-boot-env-default.bin]="e73d2c0c44c6b00019a4c6190e8e7d03a37be710a20fa76b887bdd098fa1ff51"
	)

	display_alert "$BOARD" "核對並封裝 K3 啟動載荷" "info"
	for file in "${!expected_sha256[@]}"; do
		expected="${expected_sha256[${file}]}"
		[[ -f "${blob_dir}/${file}" ]] || exit_with_error "缺少 K3 啟動載荷：${file}"
		actual="$(sha256sum "${blob_dir}/${file}" | cut -d' ' -f1)"
		[[ "${actual}" == "${expected}" ]] ||
			exit_with_error "K3 啟動載荷雜湊不符：${file}"
	done
	[[ -s "${blob_dir}/README.txt" ]] || exit_with_error "缺少 K3 來源與授權說明"
	run_host_command_logged cp -fv \
		"${blob_dir}/env.bin" \
		"${blob_dir}/bootinfo_block.bin" \
		"${blob_dir}/FSBL.bin" \
		"${blob_dir}/esos.itb" \
		"${blob_dir}/fw_dynamic.itb" \
		"${blob_dir}/u-boot.itb" \
		"${blob_dir}/u-boot-env-default.bin" \
		"${blob_dir}/README.txt" \
		./
	run_host_command_logged chmod 0644 env.bin bootinfo_block.bin FSBL.bin esos.itb \
		fw_dynamic.itb u-boot.itb u-boot-env-default.bin README.txt

	loop_over_uboot_targets_and_do deploy_built_uboot_bins_for_one_target_to_packaging_area
	declare -g EXTENSION_BUILT_UBOOT="yes"
}

function pre_umount_final_image__spacemit_k3_bootfs_assets() {
	local blob_dir="${SRC}/packages/blobs/riscv64/spacemit-k3/bpi-sm10"
	local boot_dir="${MOUNT}/boot"

	[[ -d "${boot_dir}" ]] || return 0

	display_alert "$BOARD" "安裝 K3 開機分割區輔助檔案" "info"
	run_host_command_logged cp -fv "${blob_dir}/env_k3.txt" "${boot_dir}/env_k3.txt"
	[[ -f "${blob_dir}/bianbu.bmp" ]] && run_host_command_logged cp -fv "${blob_dir}/bianbu.bmp" "${boot_dir}/bianbu.bmp"

	if [[ -f "${boot_dir}/uInitrd" ]]; then
		run_host_command_logged cp -fv "${boot_dir}/uInitrd" "${boot_dir}/initramfs-generic.img"
	fi
}

function write_uboot_platform() {
	local dir="${1}"
	local device="${2}"
	local file

	for file in env.bin bootinfo_block.bin FSBL.bin esos.itb fw_dynamic.itb u-boot.itb; do
		[[ -f "${dir}/${file}" ]] || {
			echo "write_uboot_platform: missing ${dir}/${file}" >&2
			return 1
		}
	done

	echo "正在寫入 SpacemiT K3 啟動鏈至 ${device}"
	dd if="${dir}/env.bin" of="${device}" bs=1K seek=640 conv=fsync,notrunc
	dd if="${dir}/bootinfo_block.bin" of="${device}" bs=1K seek=1024 conv=fsync,notrunc
	dd if="${dir}/FSBL.bin" of="${device}" bs=1K seek=1536 conv=fsync,notrunc
	dd if="${dir}/esos.itb" of="${device}" bs=1K seek=4096 conv=fsync,notrunc
	dd if="${dir}/fw_dynamic.itb" of="${device}" bs=1K seek=7168 conv=fsync,notrunc
	dd if="${dir}/u-boot.itb" of="${device}" bs=1K seek=8192 conv=fsync,notrunc
	sync
}
