declare -g ARCH=arm64
declare -g OFFSET=16
declare -g ATFSOURCE='https://github.com/mtk-openwrt/arm-trusted-firmware.git'
declare -g FILOGIC_SOC="${FILOGIC_SOC:-mt7988}"
declare -g FILOGIC_BOOT_DEVICE="${FILOGIC_BOOT_DEVICE:-sdmmc}"
declare -g FILOGIC_ATF_FLAGS="${FILOGIC_ATF_FLAGS:-BOARD_BGA=1 HAVE_DRAM_OBJ_FILE=yes DRAM_USE_COMB=1}"
declare -g FILOGIC_FIP_NAME="${FILOGIC_FIP_NAME:-u-boot_${FILOGIC_BOOT_DEVICE}.fip}"
declare -g ATF_TARGET_MAP="PLAT=${FILOGIC_SOC} BOOT_DEVICE=${FILOGIC_BOOT_DEVICE} USE_MKIMAGE=1 ${FILOGIC_ATF_FLAGS} all;;build/${FILOGIC_SOC}/release/bl2.img build/${FILOGIC_SOC}/release/bl31.bin"
declare -g ATFBRANCH="branch:mtksoc-20250212"
declare -g BOOTDELAY=1
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-filogic"}"
declare -g BOOTBRANCH="${BOOTBRANCH:-"tag:v2025.04"}"
declare -g BOOTENV_FILE='filogic.txt'
declare -g UBOOT_TARGET_MAP=";;u-boot.bin ${FILOGIC_FIP_NAME}:u-boot.fip bl2.img"
declare -g BOOTSCRIPT='boot-filogic.cmd:boot.cmd'
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g LINUXFAMILY=filogic

# filogic is a network platform so Proton/WINE isn't probable.
extension_hook_opt_out "armbian_kernel_config__enable_ntsync"

# This build requires xxd
function add_host_dependencies__filogic_add_xxd_hostdep() {
	display_alert "Adding xxd dep" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} xxd arm-trusted-firmware-tools"
}

# Handling of FIP blobs
function uboot_custom_postprocess() {
	: "${atftempdir:?ATF 暫存目錄未設定}"
	run_host_command_logged rm -f ./bl2.img "./${FILOGIC_FIP_NAME}"
	run_host_command_logged cp "${atftempdir}/bl2.img" ./bl2.img
	run_host_command_logged fiptool create \
	  --soc-fw "${atftempdir}/bl31.bin" \
	  --nt-fw ./u-boot.bin \
	  "./${FILOGIC_FIP_NAME}"
}

# 將安裝 U-Boot 所需的 GPT 範本一併封裝，目標機不再依賴建置主機路徑。
function pre_package_uboot_image__filogic_gpt_template() {
	run_host_command_logged install -Dm0644 \
	  "${SRC}/packages/blobs/filogic/gpt" \
	  "${destination}/usr/lib/${uboot_name}/gpt"
}

case $BRANCH in
	legacy)
		KERNELSOURCE='https://github.com/chainsx/linux-filogic.git'
		KERNELBRANCH="branch:linux-6.12.35"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		KERNELPATCHDIR="${LINUXFAMILY}-${BRANCH}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;

	current)
		KERNELSOURCE="${FILOGIC_KERNELSOURCE:-https://github.com/frank-w/BPI-Router-Linux.git}"
		KERNELBRANCH="${FILOGIC_KERNELBRANCH:-branch:6.12-main}"
		declare -g KERNEL_MAJOR_MINOR="${FILOGIC_KERNEL_MAJOR_MINOR:-6.12}"
		KERNELPATCHDIR="${FILOGIC_KERNELPATCHDIR:-archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}}"
		LINUXCONFIG="${FILOGIC_LINUXCONFIG:-linux-${LINUXFAMILY}-${BRANCH}}"

		;;

	edge)
		#KERNELSOURCE='https://github.com/frank-w/BPI-Router-Linux.git'
		#KERNELBRANCH="branch:6.16-rsslro"
		declare -g KERNEL_MAJOR_MINOR="6.16"
		KERNELPATCHDIR="archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;
esac

write_uboot_platform() {
	local source_dir="$1" target="$2" payload last_start last_size
	for payload in bl2.img u-boot.fip gpt; do
		if [[ ! -s "${source_dir}/${payload}" ]]; then
			echo "缺少 Filogic U-Boot 安裝檔：${source_dir}/${payload}" >&2
			return 1
		fi
	done
	dd if="${source_dir}/bl2.img" of="${target}" bs=512 seek=34 status=noxfer >/dev/null 2>&1
	dd if="${source_dir}/u-boot.fip" of="${target}" bs=512 seek=13312 status=noxfer >/dev/null 2>&1
	
	# backup gpt table
	last_start=$(parted "${target}" unit s print | grep -v "^$" | tail -n 1 | awk '{print $2}' | tr -d 's')
	last_size=$(parted "${target}" unit s print | grep -v "^$" | tail -n 1 | awk '{print $4}' | tr -d 's')
	# write mtk gpt table
	dd if="${source_dir}/gpt" of="${target}" conv=notrunc
	# append armbian rootfs info
	echo "${last_start},${last_size}" | sfdisk --no-reread --append "${target}"
}

extension_hook_opt_out "armbian_kernel_config__enable_various_filesystems"
# This is an example of how to override an armbian_kernel_config hook.
# We don't *need* EXT4_FS to be a module [as opposed to the default as of 2026Jan it's built-in],
# but testing has so far shown it's not *mandatory* to be built-in AND we need an example.
function armbian_kernel_config__enable_various_filesystems() {
	opts_m+=("BTRFS_FS")                  # Enables the BTRFS file system support
	opts_y+=("BTRFS_FS_POSIX_ACL")        # Enables POSIX ACL support for BTRFS
	opts_m+=("EXT4_FS")                   # Enables EXT4 file system support as a module
	opts_y+=("EXT4_FS_POSIX_ACL")         # Enables POSIX ACL support for EXT4
	opts_y+=("EXT4_FS_SECURITY")          # Enables security extensions for EXT4 file system
	opts_m+=("EROFS_FS")                  # Extended ReadOnly FS, useful for docker images
}
