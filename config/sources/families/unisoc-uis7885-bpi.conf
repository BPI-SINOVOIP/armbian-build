declare -g ARCH="arm64"
LINUXFAMILY="unisoc-uis7885-bpi"
SERIALCON="ttyS1"
ATF_COMPILE="no"

UNISOC_UIS7885_BPI_VENDOR_ROOT="${UNISOC_UIS7885_BPI_VENDOR_ROOT:-/media/pi/SMCI/bpi/unisoc}"
UNISOC_UIS7885_BPI_RELEASE_ROOT="${UNISOC_UIS7885_BPI_RELEASE_ROOT:-${UNISOC_UIS7885_BPI_VENDOR_ROOT}/release/bpi-m2c}"
UNISOC_UIS7885_BPI_SOURCE_ROOT="${UNISOC_UIS7885_BPI_SOURCE_ROOT:-${UNISOC_UIS7885_BPI_VENDOR_ROOT}/sync-20260524/source_sync_rls_25c}"
UNISOC_UIS7885_BPI_BASELINE="UNC_LINUX_RLS_25C_W26.07.2"
UNISOC_UIS7885_BPI_MANIFEST_COMMIT="7ac2b5ae548b9dd9c4d2f0b32476abd5c6fa7058"
UNISOC_UIS7885_BPI_VALIDATION_CONTRACT="config/validation/bananapi-unisoc-uis7885-m2c-vendor.json"

function late_family_config__unisoc_uis7885_bpi_is_vendor_pac_wip() {
	exit_with_error \
		"BPI-M2C UNISOC 目前只有 L0 本機來源快照稽核，不是一般 Armbian raw image 目標" \
		"未分類輸入、不可重放差異、授權與簽署鏈尚未封閉；新舊工具均不得建立公開映像"
}
