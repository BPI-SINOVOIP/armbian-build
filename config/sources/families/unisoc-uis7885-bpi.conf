declare -g ARCH="arm64"
LINUXFAMILY="unisoc-uis7885-bpi"
SERIALCON="ttyS1"
ATF_COMPILE="no"

UNISOC_UIS7885_BPI_VENDOR_ROOT="${UNISOC_UIS7885_BPI_VENDOR_ROOT:-/media/pi/SMCI/bpi/unisoc}"
UNISOC_UIS7885_BPI_RELEASE_ROOT="${UNISOC_UIS7885_BPI_RELEASE_ROOT:-${UNISOC_UIS7885_BPI_VENDOR_ROOT}/release/bpi-m2c}"

function late_family_config__unisoc_uis7885_bpi_is_vendor_pac_wip() {
	exit_with_error \
		"BPI-M2C UNISOC is currently a vendor secure-boot/PAC WIP, not a normal Armbian raw-image target" \
		"Rebuild vendor baselines with tools/build-bpi-m2c-unisoc-yocto.sh and stage outputs with tools/stage-bpi-m2c-unisoc-release.sh under ${UNISOC_UIS7885_BPI_RELEASE_ROOT}"
}
