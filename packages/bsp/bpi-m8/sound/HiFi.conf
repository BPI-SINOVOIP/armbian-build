# SPDX-License-Identifier: BSD-3-Clause
SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='OutputL Mixer DACR Switch' off"
		cset "name='OutputR Mixer DACL Switch' off"
		cset "name='OutputL Mixer DACL Switch' on"
		cset "name='OutputR Mixer DACR Switch' on"
		cset "name='HPOUTL Source Mux' OMIXL"
		cset "name='HPOUTR Source Mux' OMIXR"
		cset "name='HPOUTL Switch' on"
		cset "name='HPOUTR Switch' on"
	]

	DisableSequence [
		cset "name='HPOUTL Switch' off"
		cset "name='HPOUTR Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "HPOUT"
		JackControl "HP Jack"
	}
}

# Keep the existing capture PCM available without changing microphone routing
# or gains when selecting the headphone playback profile.
SectionDevice."Mic" {
	Comment "Headset microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
		JackControl "HS MIC Jack"
	}
}
