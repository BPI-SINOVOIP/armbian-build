# The BSP scanout device is card0; keep the desktop on software modesetting.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "BPI-M8 Display"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "PageFlip" "false"
    Option "VariableRefresh" "false"
    Option "SWcursor" "true"
    Option "Monitor-DSI-1" "BPI-M8 DSI"
    Option "Monitor-HDMI-1" "BPI-M8 HDMI"
EndSection

Section "Monitor"
    Identifier "BPI-M8 HDMI"
    Option "Primary" "true"
    # Prefer UHD when advertised; other monitors keep their valid EDID modes.
    Option "PreferredMode" "3840x2160"
EndSection

# The panel scans 800x1280 natively; rotate the desktop, not the DSI timing.
# Extend to the right; HDMI uses its own mode, not the panel resolution.
Section "Monitor"
    Identifier "BPI-M8 DSI"
    Option "PreferredMode" "800x1280"
    Option "Rotate" "right"
    Option "RightOf" "HDMI-1"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "BPI-M8 Display"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
