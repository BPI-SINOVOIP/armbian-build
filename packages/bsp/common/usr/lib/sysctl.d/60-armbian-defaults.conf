# Armbian 板級支援套件的核心 sysctl 預設值。
#
# 使用 Armbian 自有檔名，避免覆寫發行版套件的 50-default.conf。
# BSP 提供 linux-sysctl-defaults 的預設值，不需另裝該套件。
# 明列設定鍵，不使用舊版 systemd 無法解析的萬用字元。
# 舊核心可能缺少的設定鍵保留「-」前綴，略過缺鍵錯誤。
# 本次改名不更動設定值；管理者可用 /etc/sysctl.d/90-*.conf 覆蓋。

# SysRq 位元遮罩 0x01b6 = 438，保留同步、唯讀重掛載及救援重啟等功能。
kernel.sysrq = 438

# 核心傾印檔名附加 PID。
kernel.core_uses_pid = 1

# 反向路徑檢查採寬鬆模式，以相容非對稱路由。
# 只設 default；有效值取 all 與介面值的最大值，避免覆蓋各介面選擇。
net.ipv4.conf.default.rp_filter = 2

# 拒絕來源路由。
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0

# 移除主要位址時提升次要位址。
net.ipv4.conf.default.promote_secondaries = 1
net.ipv4.conf.all.promote_secondaries = 1

# 允許 ping(8) 不使用 setuid 或 CAP_NET_RAW；略過舊核心缺鍵錯誤。
-net.ipv4.ping_group_range = 0 2147483647

# 採用 fq_codel 封包排程，抑制緩衝區膨脹；略過不支援的舊核心。
-net.core.default_qdisc = fq_codel

# 保護硬連結、符號連結、一般檔案與 FIFO。
# protected_regular = 2 與 linux-sysctl-defaults 一致。
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 1

# 記憶體映射數量上限與 linux-sysctl-defaults 一致。
vm.max_map_count = 1048576
