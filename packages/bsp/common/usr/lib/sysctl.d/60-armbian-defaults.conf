# Armbian 板級支援套件的核心參數預設值。
#
# 內容對齊發行版的 linux-sysctl-defaults 套件，但使用 Armbian 專屬檔名，
# 避免與舊版 Ubuntu 由 systemd 擁有的 50-default.conf 發生封裝衝突。
# 各設定均明確列出，不使用舊版 systemd 無法解析的萬用字元；舊版廠商核心
# 可能缺少的鍵使用「-」容錯前綴，讓缺少鍵值時略過而不在每次開機留下錯誤。
# 如需覆寫，請在 /etc/sysctl.d/90-*.conf 設定。

# 系統請求功能位元遮罩，可保留同步、唯讀重新掛載、重開機、程序終止與
# 序列埠堆疊追蹤等無頭設備救援能力。
kernel.sysrq = 438

# 在核心傾印檔名附加程序識別碼。
kernel.core_uses_pid = 1

# 反向路徑篩選採寬鬆模式，以支援非對稱路由。只設定 default，避免 all
# 覆蓋各網路介面的個別選擇。
net.ipv4.conf.default.rp_filter = 2

# 不接受來源路由。
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0

# 移除主要位址時提升次要位址。
net.ipv4.conf.default.promote_secondaries = 1
net.ipv4.conf.all.promote_secondaries = 1

# 允許 ping 不依賴 setuid 或 CAP_NET_RAW；舊核心缺少此鍵時容錯略過。
-net.ipv4.ping_group_range = 0 2147483647

# 使用 Fair Queue CoDel 降低緩衝膨脹；核心未提供 sch_fq_codel 時容錯略過。
-net.core.default_qdisc = fq_codel

# 強化硬連結、符號連結、一般檔案與 FIFO 保護。
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 1

# 提高單一程序記憶體映射數量上限，對齊發行版預設值。
vm.max_map_count = 1048576
